# SAAX Protocol — self-hosted store layer (Day 8 migration from Supabase platform)
#
# Operator decisions (confirmed):
#   - Database: Postgres in Docker (not Supabase platform)
#   - REST layer: PostgREST in Docker, PGRST_DB_SCHEMA=saax_router (schema
#     exposure scoped to the saax_router schema only)
#   - Wallet custody: Coinbase Agentic Wallet MCP (NOT installed — optional,
#     deferred; constraints prohibit MCP install on this pass)
#
# Minimal footprint: PostgreSQL + PostgREST only. No Auth/Realtime/Storage/
# Studio/Edge Functions (that stack needs 11 containers; SAAX Protocol doesn't).
#
# Network: the two services share `saax_net`. Host ports: 5433 (db, since 5432
# is taken by cax_postgres on this machine) and 3000 (PostgREST). Internal
# port 5432 is untouched — PostgREST connects over the docker network
# (saax-db:5432), so nothing depends on the host mapping.
#
# Password/secret come from .env (same folder). Both are operator-generated
# random values — never committed.

services:
  saax-db:
    image: postgres:16-alpine
    container_name: saax-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: saax_router
    volumes:
      - saax_db_data:/var/lib/postgresql/data
      - ./dump:/docker-entrypoint-initdb.d:ro   # init SQL if present
    ports:
      - "5433:5432"          # host 5433 -> container 5432 (host 5432 is busy)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d saax_router"]
      interval: 5s
      timeout: 5s
      retries: 12
    networks:
      - saax_net
    restart: unless-stopped

  saax-postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: saax-postgrest
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD}@saax-db:5432/saax_router
      PGRST_DB_SCHEMA: saax_router          # expose ONLY saax_router (no platform exposure)
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${POSTGREST_JWT_SECRET}
      PGRST_SERVER_PORT: 3000
    depends_on:
      saax-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - saax_net
    restart: unless-stopped

volumes:
  saax_db_data:

networks:
  saax_net:
    driver: bridge